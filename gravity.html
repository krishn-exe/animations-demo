<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Simulation</title>
  <link rel="stylesheet" href="css/gravity.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>

<body>

  <div class="controls">
    <button id="pauseBtn"><i class="fa-solid fa-play"></i></button>
    <button id="resetBtn"><i class="fa-solid fa-rotate-left"></i></button>
    <div class="slider-container">
      <label for="dtSlider">speed: <span id="dtVal">0.5</span></label>
      <input type="range" id="dtSlider" min="0.01" max="5" step="0.04" value="0.5">
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
