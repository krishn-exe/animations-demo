<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gravity Simulation</title>
  <link rel="stylesheet" href="css/gravity.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="assets/global.png">
</head>

<body>

  <div class="controls">
    <button id="pauseBtn"><i class="fa-solid fa-pause"></i></button>
    <button id="resetBtn"><i class="fa-solid fa-rotate-left"></i></button>
    <button id="clearBtn"><i class="fa-solid fa-trash"></i></button>
    <div class="slider-group">
      <label for="dtSlider">dt: <span id="dtVal">1.0</span></label>
      <input type="range" id="dtSlider" min="0.01" max="10" step="0.01" value="1.0">
    </div>
    <div class="slider-group">
      <label for="GSlider">G: <span id="GVal">1.0</span></label>
      <input type="range" id="GSlider" min="0.01" max="10" step="0.01" value="1.0">
    </div>
    <div class="slider-group">
      <label for="SofteningSlider">Softening: <span id="SofteningVal">5.0</span></label>
      <input type="range" id="SofteningSlider" min="0" max="20" step="0.1" value="5.0">
    </div>
  </div>
  <canvas id="canvas"></canvas>
  <script src="script.js"></script>
</body>
</html>
